<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brankas LM - P2P Emas Digital v1 </title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f0f4f9; }
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #0a2a3b, #071e2c); z-index: 2000; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; border-radius: 48px; padding: 48px 40px; max-width: 450px; width: 90%; text-align: center; }
        .login-card h2 { font-size: 28px; background: linear-gradient(135deg, #FFD966, #FFA41C); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .demo-btn { background: linear-gradient(95deg, #FFA41C, #FF8C00); border: none; border-radius: 50px; padding: 14px 24px; width: 100%; cursor: pointer; font-size: 16px; font-weight: 600; color: white; margin-top: 8px; }
        .app { display: flex; min-height: 100vh; }
        .sidebar { width: 280px; background: linear-gradient(180deg, #0a2a3b 0%, #071e2c 100%); color: #e0edf5; }
        .logo-area { padding: 28px 24px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo-area h2 { font-family: 'Poppins', sans-serif; font-size: 26px; background: linear-gradient(135deg, #FFD966, #FFA41C); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .nav-menu { padding: 20px; }
        .nav-item { display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-radius: 14px; cursor: pointer; color: #cbdae3; }
        .nav-item.active { background: rgba(255, 180, 71, 0.2); color: #FFC857; border-left: 3px solid #FFB347; }
        .main-content { flex: 1; padding: 24px 32px; overflow-y: auto; }
        .user-info-bar { background: white; border-radius: 60px; padding: 8px 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
        .gold-card { background: linear-gradient(135deg, #1a3a4a, #0e2a38); border-radius: 28px; padding: 24px; margin-bottom: 32px; color: #FFD966; }
        .gold-balance { background: rgba(0,0,0,0.3); border-radius: 20px; padding: 16px; text-align: center; }
        .balance-gram { font-size: 2.5rem; font-weight: 800; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 32px; }
        .stat-card { background: white; padding: 20px; border-radius: 28px; }
        .stat-value { font-size: 1.8rem; font-weight: 800; color: #1e577a; }
        .section-card { background: white; border-radius: 32px; padding: 24px; margin-bottom: 32px; }
        .btn-primary { background: linear-gradient(95deg, #FFA41C, #FF8C00); border: none; padding: 10px 24px; border-radius: 40px; font-weight: 600; color: white; cursor: pointer; }
        .btn-info { background: #3498db; color: white; border: none; padding: 8px 16px; border-radius: 40px; cursor: pointer; }
        .listing-grid { display: flex; flex-direction: column; gap: 16px; }
        .listing-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: #fefefe; border-radius: 24px; border: 1px solid #eef2f6; flex-wrap: wrap; gap: 12px; }
        .form-group { margin-bottom: 20px; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px 16px; border-radius: 20px; border: 1px solid #caddf0; }
        .row-2cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; max-width: 500px; width: 90%; border-radius: 32px; padding: 28px; }
        .close-modal { float: right; font-size: 26px; cursor: pointer; }
        .sync-status { position: fixed; bottom: 20px; right: 20px; background: rgba(0,0,0,0.8); color: white; padding: 8px 16px; border-radius: 20px; font-size: 12px; z-index: 1000; }
        .sync-status.success { background: #27ae60; }
        .sync-status.error { background: #e74c3c; }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #FFD966, #FFA41C); display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .logout-btn { background: #fee2e2; border: none; padding: 8px 20px; border-radius: 40px; color: #b91c1c; cursor: pointer; }
        @media (max-width: 750px) { .sidebar { width: 85px; } .sidebar .nav-item span { display: none; } .main-content { padding: 16px; } }
        .divider { margin: 20px 0; color: #aaa; }
        .demo-note { background: #eef3fc; padding: 12px; border-radius: 16px; font-size: 12px; margin-top: 20px; text-align: left; }
    </style>
</head>
<body>
<div id="loginOverlay" class="login-overlay">
    <div class="login-card">
        <h2><i class="fas fa-coins"></i> Brankas LM</h2>
        <div class="subtitle">P2P Marketplace Emas Digital</div>
        <div id="googleButton" class="google-btn-container"></div>
        <div class="divider">atau</div>
        <button id="demoLoginBtn" class="demo-btn"><i class="fas fa-user-friends"></i> Demo Mode</button>
        <div class="demo-note"><i class="fas fa-cloud-upload-alt"></i> Login dengan Google untuk sync data ke cloud</div>
    </div>
</div>

<div class="app" id="appContainer" style="display: none;">
    <div class="sidebar">
        <div class="logo-area"><h2>Brankas LM</h2></div>
        <div class="nav-menu">
            <div class="nav-item active" data-page="dashboard"><i class="fas fa-tachometer-alt"></i> <span>Dashboard</span></div>
            <div class="nav-item" data-page="marketplace"><i class="fas fa-store"></i> <span>Marketplace</span></div>
            <div class="nav-item" data-page="buat-listing"><i class="fas fa-plus-circle"></i> <span>Buat Listing</span></div>
            <div class="nav-item" data-page="riwayat"><i class="fas fa-history"></i> <span>Riwayat</span></div>
        </div>
    </div>
    <div class="main-content">
        <div class="user-info-bar">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div class="user-avatar" id="userAvatar">👤</div>
                <div><strong id="userName">Loading...</strong><br><span id="userEmail" style="font-size:12px;"></span></div>
            </div>
            <div style="display: flex; gap: 10px;">
                <button id="syncBtn" class="btn-info"><i class="fas fa-sync-alt"></i> Sync</button>
                <button id="loadBtn" class="btn-primary" style="background:#27ae60;"><i class="fas fa-download"></i> Load</button>
                <button id="logoutBtn" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>
        <div id="mainContent"></div>
    </div>
</div>

<div id="syncStatus" class="sync-status"><i class="fas fa-cloud-upload-alt"></i> Siap</div>

<script>
    // ========== KONFIGURASI ==========
    // GANTI DENGAN URL APPS SCRIPT ANDA!
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyek0jYUTNaduvAnVvUR4hzTli-F5-h0B1m647_GvdeAFG4ltQlLwGAkQlW4_CG1VeF/exec";
    const GOOGLE_CLIENT_ID = "359149804614-vnhcg76muilk77homh9dlkj2qg3lol5u.apps.googleusercontent.com";
    
    let currentUser = null;
    let userData = {
        goldBalance: 50.0,
        userName: "",
        listings: [],
        offers: [],
        transactions: []
    };
    let currentPage = "dashboard";
    
    function formatRupiah(amount) {
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR' }).format(amount);
    }
    
    function showStatus(msg, type) {
        const el = document.getElementById('syncStatus');
        el.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-cloud-upload-alt'}"></i> ${msg}`;
        el.className = `sync-status ${type || ''}`;
        setTimeout(() => { if(type !== 'error') el.style.opacity = '0.7'; }, 3000);
    }
    
    // ========== CLOUD FUNCTIONS ==========
    async function saveToCloud() {
        if (!currentUser) return false;
        try {
            showStatus('Menyimpan...', '');
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'saveData',
                    email: currentUser.email,
                    data: {
                        userGoldBalance: { gram: userData.goldBalance, userName: userData.userName },
                        marketplaceListings: userData.listings,
                        pendingOffers: userData.offers,
                        p2pTransactions: userData.transactions
                    }
                })
            });
            const result = await response.json();
            if (result.success) {
                showStatus('✓ Tersimpan!', 'success');
                return true;
            }
            throw new Error(result.error);
        } catch(e) {
            showStatus('⚠️ Gagal sync: ' + e.message, 'error');
            return false;
        }
    }
    
    async function loadFromCloud() {
        if (!currentUser) return false;
        try {
            showStatus('Memuat...', '');
            const url = `${SCRIPT_URL}?action=getData&email=${encodeURIComponent(currentUser.email)}&t=${Date.now()}`;
            const response = await fetch(url);
            const result = await response.json();
            if (result.success && result.data) {
                const d = result.data;
                userData.goldBalance = d.userGoldBalance?.gram || 50;
                userData.userName = d.userGoldBalance?.userName || currentUser.name;
                userData.listings = d.marketplaceListings || [];
                userData.offers = d.pendingOffers || [];
                userData.transactions = d.p2pTransactions || [];
                showStatus('✓ Data dimuat!', 'success');
                render();
                return true;
            }
            throw new Error(result.error);
        } catch(e) {
            showStatus('⚠️ Gagal load: ' + e.message, 'error');
            return false;
        }
    }
    
    // ========== RENDER DASHBOARD ==========
    function renderDashboard(container) {
        container.innerHTML = `
            <div class="gold-card">
                <div class="gold-balance">
                    <div class="balance-gram">${userData.goldBalance.toFixed(2)} gr</div>
                    <div>SALDO EMAS DIGITAL</div>
                </div>
            </div>
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-title">Listing Aktif</div><div class="stat-value">${userData.listings.length}</div></div>
                <div class="stat-card"><div class="stat-title">Tawaran Masuk</div><div class="stat-value">${userData.offers.length}</div></div>
                <div class="stat-card"><div class="stat-title">Transaksi</div><div class="stat-value">${userData.transactions.length}</div></div>
            </div>
            <div class="section-card">
                <h3>Selamat datang, ${userData.userName}!</h3>
                <p style="margin-top:12px;">Gunakan menu Marketplace untuk jual/beli emas digital.</p>
                <button id="goMarketBtn" class="btn-primary" style="margin-top:16px;">Lihat Marketplace →</button>
            </div>
        `;
        document.getElementById('goMarketBtn')?.addEventListener('click', () => setPage('marketplace'));
    }
    
    function renderMarketplace(container) {
        if (userData.listings.length === 0) {
            container.innerHTML = `<div class="section-card"><p style="text-align:center;">Belum ada listing. <button id="createListingBtn" class="btn-primary">Buat Listing</button></p></div>`;
            document.getElementById('createListingBtn')?.addEventListener('click', () => setPage('buat-listing'));
            return;
        }
        container.innerHTML = `<div class="section-card"><div class="listing-grid">${userData.listings.map(l => `
            <div class="listing-item">
                <div><strong>${l.name}</strong><br><small>Penjual: ${l.seller} | Stok: ${l.qty}</small></div>
                <div>${formatRupiah(l.pricePerGram)}/gram<br>${formatRupiah(l.totalPrice)}</div>
                <button class="btn-primary buy-btn" data-id="${l.id}">Beli</button>
            </div>
        `).join('')}</div></div>`;
        document.querySelectorAll('.buy-btn').forEach(btn => {
            btn.addEventListener('click', () => alert('Fitur beli akan segera aktif!'));
        });
    }
    
    function renderBuatListing(container) {
        container.innerHTML = `<div class="section-card">
            <h3>Buat Listing Baru</h3>
            <form id="listingForm">
                <div class="form-group"><label>Nama Emas</label><input type="text" id="name" required></div>
                <div class="row-2cols">
                    <div class="form-group"><label>Berat (gram)</label><input type="number" id="gram" step="0.1" required></div>
                    <div class="form-group"><label>Harga/gram</label><input type="number" id="price" required></div>
                </div>
                <div class="form-group"><label>Stok</label><input type="number" id="qty" value="1"></div>
                <button type="submit" class="btn-primary">Terbitkan</button>
            </form>
        </div>`;
        document.getElementById('listingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const gram = parseFloat(document.getElementById('gram').value);
            const price = parseFloat(document.getElementById('price').value);
            userData.listings.push({
                id: Date.now().toString(),
                name: document.getElementById('name').value,
                gram: gram,
                pricePerGram: price,
                totalPrice: gram * price,
                qty: parseInt(document.getElementById('qty').value),
                seller: userData.userName
            });
            await saveToCloud();
            setPage('marketplace');
            alert('✅ Listing berhasil dibuat!');
        });
    }
    
    function renderRiwayat(container) {
        if (userData.transactions.length === 0) {
            container.innerHTML = `<div class="section-card"><p style="text-align:center;">Belum ada transaksi</p></div>`;
            return;
        }
        container.innerHTML = `<div class="section-card"><table style="width:100%; border-collapse:collapse;">${userData.transactions.map(t => `
            <tr style="border-bottom:1px solid #eee;"><td style="padding:12px;">${t.asset}</td><td>${t.gram}g</td><td>${formatRupiah(t.totalPrice)}</td><td>${t.date}</td></tr>
        `).join('')}</table></div>`;
    }
    
    function render() {
        const container = document.getElementById('mainContent');
        if (!container) return;
        if (currentPage === 'dashboard') renderDashboard(container);
        else if (currentPage === 'marketplace') renderMarketplace(container);
        else if (currentPage === 'buat-listing') renderBuatListing(container);
        else if (currentPage === 'riwayat') renderRiwayat(container);
        document.querySelectorAll('.nav-item').forEach(nav => {
            nav.classList.toggle('active', nav.dataset.page === currentPage);
        });
    }
    
    function setPage(page) {
        currentPage = page;
        render();
    }
    
    // ========== GOOGLE LOGIN ==========
    function initGoogleLogin() {
        if (typeof google === 'undefined') { setTimeout(initGoogleLogin, 500); return; }
        google.accounts.id.initialize({
            client_id: GOOGLE_CLIENT_ID,
            callback: async (res) => {
                const resp = await fetch(`https://oauth2.googleapis.com/tokeninfo?id_token=${res.credential}`);
                const data = await resp.json();
                if (data.email) {
                    currentUser = { email: data.email, name: data.name };
                    userData.userName = data.name;
                    document.getElementById('loginOverlay').style.display = 'none';
                    document.getElementById('appContainer').style.display = 'flex';
                    document.getElementById('userName').innerText = data.name;
                    document.getElementById('userEmail').innerHTML = data.email;
                    document.getElementById('userAvatar').innerHTML = data.name.charAt(0);
                    await loadFromCloud();
                    render();
                }
            }
        });
        google.accounts.id.renderButton(document.getElementById('googleButton'), { theme: 'outline', size: 'large', width: '100%' });
    }
    
    async function demoLogin() {
        const name = prompt('Masukkan nama:', 'Pengguna Demo');
        if (name) {
            currentUser = { email: name + '@demo.local', name: name };
            userData.userName = name;
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('appContainer').style.display = 'flex';
            document.getElementById('userName').innerText = name;
            document.getElementById('userEmail').innerHTML = currentUser.email;
            document.getElementById('userAvatar').innerHTML = name.charAt(0);
            render();
        }
    }
    
    function logout() {
        currentUser = null;
        document.getElementById('loginOverlay').style.display = 'flex';
        document.getElementById('appContainer').style.display = 'none';
    }
    
    document.getElementById('demoLoginBtn')?.addEventListener('click', demoLogin);
    document.getElementById('logoutBtn')?.addEventListener('click', logout);
    document.getElementById('syncBtn')?.addEventListener('click', saveToCloud);
    document.getElementById('loadBtn')?.addEventListener('click', loadFromCloud);
    
    initGoogleLogin();
</script>
</body>
</html>
