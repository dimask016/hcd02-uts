<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Brankas LM - P2P Emas Digital | Fitur Tawar</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f0f4f9;
            color: #1a2c3e;
            overflow-x: hidden;
        }

        .app {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #0a2a3b 0%, #071e2c 100%);
            color: #e0edf5;
            transition: all 0.3s;
            box-shadow: 4px 0 20px rgba(0,0,0,0.1);
            z-index: 20;
        }

        .logo-area {
            padding: 28px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 28px;
        }

        .logo-area h2 {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 26px;
            background: linear-gradient(135deg, #FFD966, #FFA41C);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo-area span {
            font-size: 12px;
            color: #8aaec2;
            margin-top: 5px;
            display: block;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 0 20px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 18px;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 500;
            color: #cbdae3;
        }

        .nav-item i {
            width: 24px;
            font-size: 1.2rem;
        }

        .nav-item.active {
            background: rgba(255, 180, 71, 0.2);
            color: #FFC857;
            border-left: 3px solid #FFB347;
        }

        .nav-item:hover:not(.active) {
            background: rgba(255,255,255,0.08);
            color: white;
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }

        .page-title {
            font-size: 1.9rem;
            font-weight: 700;
            background: linear-gradient(130deg, #1c4e6e, #2c6f96);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Kartu Saldo Emas */
        .gold-card {
            background: linear-gradient(135deg, #1a3a4a 0%, #0e2a38 100%);
            border-radius: 28px;
            padding: 24px;
            margin-bottom: 32px;
            color: #FFD966;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,215,0,0.2);
        }

        .gold-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,215,0,0.2);
        }

        .gold-brand {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .gold-brand h3 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #FFD966;
        }

        .gold-brand span {
            font-size: 0.7rem;
            color: #b8860b;
        }

        .gold-badge {
            background: rgba(0,0,0,0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            color: #FFC857;
        }

        .gold-card-body {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .gold-user {
            font-size: 1rem;
            color: #e0e0e0;
            letter-spacing: 1px;
        }

        .gold-user span {
            color: #FFD966;
            font-weight: 600;
        }

        .gold-balance {
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            padding: 16px;
            text-align: center;
        }

        .gold-balance .balance-gram {
            font-size: 2.5rem;
            font-weight: 800;
            color: #FFD966;
        }

        .gold-balance .balance-label {
            font-size: 0.7rem;
            color: #b0c4de;
            letter-spacing: 1px;
        }

        .rupiah-conversion {
            background: rgba(255,215,0,0.1);
            border-radius: 16px;
            padding: 12px;
            text-align: center;
        }

        .rupiah-conversion .rupiah-value {
            font-size: 1.2rem;
            font-weight: 700;
            color: #FFD966;
        }

        .gold-limits {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            font-size: 0.75rem;
        }

        .gold-limits div {
            background: rgba(0,0,0,0.2);
            padding: 8px 12px;
            border-radius: 16px;
            flex: 1;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: white;
            padding: 20px 22px;
            border-radius: 28px;
            box-shadow: 0 8px 18px rgba(0,0,0,0.04);
            transition: transform 0.2s;
            border: 1px solid #e9f0f5;
        }
        .stat-card:hover { transform: translateY(-3px); }
        .stat-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: #5c7f94; }
        .stat-value { font-size: 1.9rem; font-weight: 800; margin-top: 8px; color: #1e577a; }

        .section-card {
            background: white;
            border-radius: 32px;
            padding: 24px 28px;
            margin-bottom: 32px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.02);
            border: 1px solid #eef2f8;
        }

        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .btn-primary {
            background: linear-gradient(95deg, #FFA41C, #FF8C00);
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary:hover { transform: scale(0.97); }
        .btn-outline {
            background: transparent;
            border: 1.5px solid #FFA41C;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 500;
            color: #d97c15;
            cursor: pointer;
        }
        .btn-sm { padding: 6px 14px; font-size: 0.8rem; }
        .btn-success { background: #27ae60; color: white; border: none; padding: 6px 14px; border-radius: 40px; cursor: pointer; }
        .btn-danger { background: #e74c3c; color: white; border: none; padding: 6px 14px; border-radius: 40px; cursor: pointer; }

        .listing-grid { display: flex; flex-direction: column; gap: 16px; }
        .listing-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px;
            background: #fefefe;
            border-radius: 24px;
            border: 1px solid #eef2f6;
            flex-wrap: wrap;
            gap: 12px;
        }
        .listing-info { flex: 2; }
        .listing-price { font-weight: 700; font-size: 1.2rem; color: #1e577a; }
        .badge-sell { background: #e6f7e6; color: #2b7e3a; padding: 4px 12px; border-radius: 40px; font-size: 0.7rem; font-weight: 600; }

        /* Tawaran Menunggu */
        .offers-card {
            background: #fff8e7;
            border-left: 4px solid #FFA41C;
        }
        .offer-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #ffe0b5;
            flex-wrap: wrap;
            gap: 10px;
        }
        .badge-pending { background: #fef3c7; color: #b45309; padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; }

        .form-group { margin-bottom: 20px; }
        .form-group label { font-weight: 600; display: block; margin-bottom: 8px; color: #235b7c; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 20px;
            border: 1px solid #caddf0;
            font-family: 'Inter', sans-serif;
        }
        .row-2cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .price-range-info { background: #fef7e0; padding: 12px 16px; border-radius: 16px; margin-top: 8px; font-size: 0.8rem; }
        .fee-breakdown { background: #e8f5e9; padding: 12px 16px; border-radius: 16px; margin-top: 16px; }
        .info-message { background: #eef3fc; padding: 12px 16px; border-radius: 16px; font-size: 0.85rem; margin-top: 12px; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            max-width: 550px;
            width: 90%;
            border-radius: 32px;
            padding: 28px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .close-modal { float: right; font-size: 26px; cursor: pointer; }

        .history-table { width: 100%; border-collapse: collapse; }
        .history-table th, .history-table td { padding: 12px 8px; text-align: left; border-bottom: 1px solid #ecf3f8; }

        @media (max-width: 750px) {
            .sidebar { width: 85px; overflow: hidden; }
            .sidebar .logo-area span, .sidebar .nav-item span:not(.icon-only) { display: none; }
            .main-content { padding: 16px; }
            .row-2cols { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="sidebar">
        <div class="logo-area">
            <h2><i class="fas fa-coins"></i> Brankas LM</h2>
            <span>P2P Emas Digital</span>
        </div>
        <div class="nav-menu">
            <div class="nav-item active" data-page="dashboard"><i class="fas fa-tachometer-alt"></i> <span>Dashboard</span></div>
            <div class="nav-item" data-page="marketplace"><i class="fas fa-store"></i> <span>Marketplace</span></div>
            <div class="nav-item" data-page="buat-listing"><i class="fas fa-plus-circle"></i> <span>Buat Listing</span></div>
            <div class="nav-item" data-page="riwayat"><i class="fas fa-history"></i> <span>Riwayat P2P</span></div>
        </div>
    </div>

    <div class="main-content" id="mainContent"></div>
</div>

<!-- Modal Detail Listing & Tawar -->
<div id="detailModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" id="closeDetailModal">&times;</span>
        <div id="modalDynamicContent"></div>
    </div>
</div>

<script>
    // ==================== DATA GLOBAL ====================
    let goldPricePerGram = 2795000;
    const PLATFORM_FEE_PERCENT = 0.5;
    const MAX_PRICE_MARKUP_PERCENT = 15;

    // User Saldo Emas
    let userGoldBalance = {
        gram: 50.0,
        minSaldo: 0.0,
        maxSaldo: 5000.0,
        validUntil: "31/12/9999",
        accountNumber: "E000007474",
        userName: "DIMAS KURNIAWAN"
    };

    // Listing Marketplace
    let marketplaceListings = [
        { id: "GLD1001", name: "Emas Digital 10 Gram", gram: 10, pricePerGram: 1295000, totalPrice: 12950000, qty: 2, seller: "EmasKuOfficial", sellerId: "seller1", desc: "Emas digital murni 24k", createdAt: "2026-03-28" },
        { id: "GLD1002", name: "Emas Digital 5 Gram", gram: 5, pricePerGram: 1295000, totalPrice: 6475000, qty: 3, seller: "GoldTrader99", sellerId: "seller2", desc: "Sertifikat kepemilikan digital", createdAt: "2026-03-27" },
        { id: "GLD1003", name: "Emas Digital 25 Gram", gram: 25, pricePerGram: 1295000, totalPrice: 32375000, qty: 1, seller: "InvestorEmas", sellerId: "seller3", desc: "Harga spesial grosir", createdAt: "2026-03-26" }
    ];

    // Struktur Tawaran (Offer) - Menunggu respons penjual
    let pendingOffers = []; // { id, listingId, buyerName, offeredPricePerGram, offeredTotal, gram, status, createdAt }
    let acceptedOffers = []; // tawaran yang disetujui

    let p2pTransactions = [
        { id: "TRX001", asset: "Emas Digital 5 Gram", gram: 5, counterparty: "AhmadFauzi", type: "Beli", totalPrice: 6475000, date: "2026-03-25", status: "Selesai", fee: 32375 }
    ];

    // Helper
    function formatRupiah(amount) {
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(amount);
    }
    function formatGram(gram) { return gram.toFixed(2) + " gr"; }
    function getSaldoRupiah() { return userGoldBalance.gram * goldPricePerGram; }
    function getMaxPricePerGram() { return goldPricePerGram * (1 + MAX_PRICE_MARKUP_PERCENT / 100); }
    function calculatePlatformFee(totalPrice) { return totalPrice * (PLATFORM_FEE_PERCENT / 100); }

    let currentPage = "dashboard";

    function render() {
        const container = document.getElementById("mainContent");
        if (!container) return;
        if (currentPage === "dashboard") renderDashboard(container);
        else if (currentPage === "marketplace") renderMarketplace(container);
        else if (currentPage === "buat-listing") renderBuatListing(container);
        else if (currentPage === "riwayat") renderRiwayat(container);
        attachNavEvents();
    }

    // DASHBOARD dengan Tampilan Tawaran Masuk untuk Penjual
    function renderDashboard(container) {
        const saldoRupiah = getSaldoRupiah();
        // Tawaran yang masuk ke listing milik "Anda" (sebagai penjual)
        const myListingsIds = marketplaceListings.filter(l => l.seller === "Anda").map(l => l.id);
        const incomingOffers = pendingOffers.filter(offer => myListingsIds.includes(offer.listingId));
        
        container.innerHTML = `
            <div class="page-header">
                <h1 class="page-title"><i class="fas fa-chart-line"></i> Dashboard Emas Digital</h1>
                <div class="btn-outline btn-sm"><i class="fas fa-sync-alt"></i> ${new Date().toLocaleDateString('id-ID')}</div>
            </div>
            <div class="gold-card">
                <div class="gold-card-header">
                    <div class="gold-brand"><h3>BRANKAS</h3><span>LM</span></div>
                    <div class="gold-brand"><h3>ANTM</h3></div>
                    <div class="gold-badge"><i class="fas fa-gem"></i> Premium</div>
                </div>
                <div class="gold-card-body">
                    <div class="gold-user"><i class="far fa-id-card"></i> ${userGoldBalance.accountNumber} | ${userGoldBalance.userName}</div>
                    <div class="gold-balance"><div class="balance-gram">${formatGram(userGoldBalance.gram)}</div><div class="balance-label">SALDO EMAS DIGITAL</div></div>
                    <div class="rupiah-conversion"><div class="balance-label">NILAI KONVERSI RUPIAH</div><div class="rupiah-value">${formatRupiah(saldoRupiah)}</div><div style="font-size:0.7rem;">Harga pasar: ${formatRupiah(goldPricePerGram)}/gram</div></div>
                    <div class="gold-limits"><div><span class="limit-label">Min Saldo</span><br><span class="limit-value">${formatGram(userGoldBalance.minSaldo)}</span></div><div><span class="limit-label">Max Saldo</span><br><span class="limit-value">${formatGram(userGoldBalance.maxSaldo)}</span></div><div><span class="limit-label">Valid Until</span><br><span class="limit-value">${userGoldBalance.validUntil}</span></div></div>
                </div>
            </div>
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-title">Harga Emas/gram</div><div class="stat-value">${formatRupiah(goldPricePerGram)}</div></div>
                <div class="stat-card"><div class="stat-title">Listing Aktif</div><div class="stat-value">${marketplaceListings.length}</div></div>
                <div class="stat-card"><div class="stat-title">Tawaran Masuk</div><div class="stat-value">${incomingOffers.length}</div></div>
            </div>
            ${incomingOffers.length > 0 ? `
            <div class="section-card offers-card">
                <h3><i class="fas fa-handshake"></i> Tawaran Masuk (Menunggu Respon Anda)</h3>
                <div id="incomingOffersList">
                    ${incomingOffers.map(offer => {
                        const listing = marketplaceListings.find(l => l.id === offer.listingId);
                        return `
                        <div class="offer-item" data-offer-id="${offer.id}">
                            <div><strong>${offer.buyerName}</strong> menawar <strong>${listing?.name || 'Emas'}</strong> (${offer.gram}g)</div>
                            <div>Harga tawar: ${formatRupiah(offer.offeredPricePerGram)}/gram → Total: ${formatRupiah(offer.offeredTotal)}</div>
                            <div>
                                <button class="btn-success btn-sm accept-offer" data-offer-id="${offer.id}">✔ Terima</button>
                                <button class="btn-danger btn-sm reject-offer" data-offer-id="${offer.id}">✘ Tolak</button>
                            </div>
                        </div>`;
                    }).join('')}
                </div>
            </div>
            ` : ''}
            <div class="section-card">
                <div class="flex-between"><h3>Marketplace</h3><button id="gotoMarketBtn" class="btn-primary">Jelajahi Listing →</button></div>
                <div class="info-message">Harga jual maksimal +15% dari pasar. Fee platform 0.5%</div>
            </div>
        `;
        document.getElementById("gotoMarketBtn")?.addEventListener("click", () => setActivePage("marketplace"));
        
        // Event untuk menerima/menolak tawaran
        document.querySelectorAll(".accept-offer").forEach(btn => {
            btn.addEventListener("click", (e) => {
                const offerId = btn.getAttribute("data-offer-id");
                acceptOffer(offerId);
            });
        });
        document.querySelectorAll(".reject-offer").forEach(btn => {
            btn.addEventListener("click", (e) => {
                const offerId = btn.getAttribute("data-offer-id");
                rejectOffer(offerId);
            });
        });
    }

    // Menerima tawaran
    function acceptOffer(offerId) {
        const offer = pendingOffers.find(o => o.id === offerId);
        if (!offer) return;
        const listing = marketplaceListings.find(l => l.id === offer.listingId);
        if (!listing) return;
        
        if (confirm(`Terima tawaran dari ${offer.buyerName} sebesar ${formatRupiah(offer.offeredPricePerGram)}/gram? Transaksi akan diproses.`)) {
            // Pindahkan ke transaksi
            const fee = calculatePlatformFee(offer.offeredTotal);
            p2pTransactions.unshift({
                id: "TRX" + Date.now(),
                asset: listing.name,
                gram: offer.gram,
                counterparty: offer.buyerName,
                type: "Jual",
                totalPrice: offer.offeredTotal,
                pricePerGram: offer.offeredPricePerGram,
                date: new Date().toISOString().slice(0,10),
                status: "Selesai",
                fee: fee
            });
            // Kurangi stok listing
            listing.qty -= 1;
            if (listing.qty <= 0) {
                const idx = marketplaceListings.findIndex(l => l.id === listing.id);
                if (idx !== -1) marketplaceListings.splice(idx, 1);
            }
            // Hapus tawaran
            pendingOffers = pendingOffers.filter(o => o.id !== offerId);
            alert(`✅ Tawaran diterima! Transaksi berhasil. Fee platform: ${formatRupiah(fee)}`);
            render();
        }
    }

    function rejectOffer(offerId) {
        if (confirm("Tolak tawaran ini?")) {
            pendingOffers = pendingOffers.filter(o => o.id !== offerId);
            alert("Tawaran ditolak.");
            render();
        }
    }

    // MARKETPLACE
    function renderMarketplace(container) {
        container.innerHTML = `
            <div class="page-header"><h1 class="page-title"><i class="fas fa-store"></i> Marketplace</h1><button id="quickSellBtn" class="btn-outline btn-sm"><i class="fas fa-plus"></i> Jual Emas</button></div>
            <div class="section-card"><div id="marketplaceList" class="listing-grid"></div></div>
        `;
        const listContainer = document.getElementById("marketplaceList");
        if (marketplaceListings.length === 0) listContainer.innerHTML = "<p style='padding:40px;text-align:center'>Belum ada listing</p>";
        else {
            listContainer.innerHTML = marketplaceListings.map(item => {
                const markup = ((item.pricePerGram / goldPricePerGram) - 1) * 100;
                return `
                <div class="listing-item">
                    <div class="listing-info">
                        <div><i class="fas fa-coins" style="font-size:28px; color:#FFB347;"></i> <strong>${item.name}</strong></div>
                        <div style="font-size:0.75rem;">Penjual: ${item.seller} | Stok: ${item.qty} | ${markup > 0 ? '+' : ''}${markup.toFixed(1)}% dari pasar</div>
                    </div>
                    <div class="listing-price">${formatRupiah(item.pricePerGram)}<span style="font-size:0.7rem;">/gram</span><br><span style="font-size:0.85rem;">Total: ${formatRupiah(item.totalPrice)}</span></div>
                    <div><button class="btn-outline btn-sm detail-btn" data-id="${item.id}">Detail & Tawar</button></div>
                </div>`;
            }).join('');
        }
        document.getElementById("quickSellBtn")?.addEventListener("click", () => setActivePage("buat-listing"));
        document.querySelectorAll(".detail-btn").forEach(btn => {
            btn.addEventListener("click", (e) => {
                const id = btn.getAttribute("data-id");
                const listing = marketplaceListings.find(l => l.id === id);
                if (listing) showDetailModal(listing);
            });
        });
    }

    // MODAL DETAIL + FITUR TAWAR (Menunggu Respon Penjual)
    function showDetailModal(listing) {
        const modal = document.getElementById("detailModal");
        const modalContent = document.getElementById("modalDynamicContent");
        const fee = calculatePlatformFee(listing.totalPrice);
        
        modalContent.innerHTML = `
            <h3><i class="fas fa-coins"></i> ${listing.name}</h3>
            <div style="background:#f8fafc; border-radius: 20px; padding: 16px; margin:16px 0;">
                <p>Penjual: ${listing.seller}</p>
                <p>Berat: ${listing.gram} gram</p>
                <p>Harga/gram: ${formatRupiah(listing.pricePerGram)}</p>
                <p><strong>Total: ${formatRupiah(listing.totalPrice)}</strong></p>
                <p>Stok: ${listing.qty}</p>
                <p>Deskripsi: ${listing.desc}</p>
            </div>
            <div class="fee-breakdown">Fee platform 0.5%: ${formatRupiah(fee)} (ditanggung penjual)</div>
            <div style="display:flex; gap:12px; margin:20px 0;">
                <button id="buyNowBtn" class="btn-primary">Beli Langsung</button>
                <button id="offerBtn" class="btn-outline"><i class="fas fa-gavel"></i> Ajukan Tawaran</button>
            </div>
            <div id="offerSection" style="display:none; margin-top:16px; padding:16px; background:#fef7e0; border-radius:20px;">
                <h4>💰 Buat Tawaran</h4>
                <input type="number" id="offerPricePerGram" placeholder="Harga per gram (Rp)" style="width:100%; padding:10px; border-radius:20px; border:1px solid #FFA41C; margin:10px 0;">
                <button id="submitOfferBtn" class="btn-primary btn-sm">Kirim Tawaran</button>
                <p style="font-size:0.7rem; margin-top:8px;">Tawaran akan dikirim ke penjual dan menunggu respons.</p>
            </div>
            <p style="font-size:0.7rem; color:#7899b0;">Transaksi aman melalui escrow Brankas LM.</p>
        `;
        modal.style.display = "flex";
        document.getElementById("closeDetailModal").onclick = () => modal.style.display = "none";
        window.onclick = (e) => { if(e.target === modal) modal.style.display = "none"; };
        
        // Beli Langsung
        document.getElementById("buyNowBtn").onclick = () => {
            if (userGoldBalance.gram >= listing.gram) {
                userGoldBalance.gram -= listing.gram;
                const feePaid = calculatePlatformFee(listing.totalPrice);
                p2pTransactions.unshift({
                    id: "TRX" + Date.now(), asset: listing.name, gram: listing.gram,
                    counterparty: listing.seller, type: "Beli", totalPrice: listing.totalPrice,
                    date: new Date().toISOString().slice(0,10), status: "Selesai", fee: feePaid
                });
                alert(`✅ Pembelian berhasil! Saldo emas Anda: ${formatGram(userGoldBalance.gram)}`);
                modal.style.display = "none";
                render();
            } else {
                alert(`Saldo emas tidak cukup! Saldo: ${formatGram(userGoldBalance.gram)}`);
            }
        };
        
        // Tampilkan form tawaran
        let offerSection = document.getElementById("offerSection");
        document.getElementById("offerBtn").onclick = () => {
            offerSection.style.display = offerSection.style.display === "none" ? "block" : "none";
        };
        
        document.getElementById("submitOfferBtn").onclick = () => {
            const offerPricePerGram = parseFloat(document.getElementById("offerPricePerGram").value);
            if (isNaN(offerPricePerGram) || offerPricePerGram <= 0) {
                alert("Masukkan harga tawaran per gram yang valid!");
                return;
            }
            const maxAllowed = getMaxPricePerGram();
            if (offerPricePerGram > maxAllowed) {
                alert(`Harga tawaran melebihi batas maksimal +15% (${formatRupiah(maxAllowed)}/gram)`);
                return;
            }
            const offeredTotal = offerPricePerGram * listing.gram;
            const newOffer = {
                id: "OFFER_" + Date.now(),
                listingId: listing.id,
                buyerName: userGoldBalance.userName,
                offeredPricePerGram: offerPricePerGram,
                offeredTotal: offeredTotal,
                gram: listing.gram,
                status: "pending",
                createdAt: new Date().toISOString()
            };
            pendingOffers.push(newOffer);
            alert(`✅ Tawaran ${formatRupiah(offerPricePerGram)}/gram (Total: ${formatRupiah(offeredTotal)}) telah dikirim ke ${listing.seller}.\nMenunggu respons penjual.`);
            offerSection.style.display = "none";
            modal.style.display = "none";
        };
    }

    function renderBuatListing(container) {
        container.innerHTML = `
            <div class="page-header"><h1 class="page-title">Buat Listing Emas Digital</h1></div>
            <div class="section-card">
                <form id="createListingForm">
                    <div class="form-group"><label>Nama Emas</label><input type="text" id="assetName" required></div>
                    <div class="row-2cols">
                        <div class="form-group"><label>Berat (Gram)</label><input type="number" id="gram" step="0.1" required></div>
                        <div class="form-group"><label>Harga Jual (per gram)</label><input type="number" id="pricePerGram" required></div>
                    </div>
                    <div id="priceRangeInfo" class="price-range-info"></div>
                    <div id="totalPreview" class="info-message"></div>
                    <div class="form-group"><label>Stok</label><input type="number" id="qty" value="1"></div>
                    <div class="form-group"><label>Deskripsi</label><textarea rows="2" id="desc"></textarea></div>
                    <button type="submit" class="btn-primary">Terbitkan Listing</button>
                </form>
            </div>
        `;
        const gramInput = document.getElementById("gram");
        const priceInput = document.getElementById("pricePerGram");
        const updatePreview = () => {
            const gram = parseFloat(gramInput.value);
            const price = parseFloat(priceInput.value);
            if (!isNaN(gram) && gram > 0 && !isNaN(price) && price > 0) {
                document.getElementById("totalPreview").innerHTML = `💰 Total harga: ${gram} × ${formatRupiah(price)} = ${formatRupiah(gram * price)}`;
                const maxPerGram = getMaxPricePerGram();
                if (price > maxPerGram) document.getElementById("priceRangeInfo").innerHTML = `<span style="color:red;">❌ Harga melebihi batas maksimal +15% (${formatRupiah(maxPerGram)}/gram)</span>`;
                else document.getElementById("priceRangeInfo").innerHTML = `✅ Harga dalam batasan. Maksimal: ${formatRupiah(maxPerGram)}/gram`;
            }
        };
        gramInput.addEventListener("input", updatePreview);
        priceInput.addEventListener("input", updatePreview);
        document.getElementById("createListingForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const gram = parseFloat(gramInput.value);
            const pricePerGram = parseFloat(priceInput.value);
            if (pricePerGram > getMaxPricePerGram()) { alert("Harga melebihi batas maksimal +15%"); return; }
            marketplaceListings.push({
                id: "GLD" + Date.now(), name: document.getElementById("assetName").value, gram, pricePerGram,
                totalPrice: gram * pricePerGram, qty: parseInt(document.getElementById("qty").value),
                seller: "Anda", sellerId: "currentUser", desc: document.getElementById("desc").value, createdAt: new Date().toISOString().slice(0,10)
            });
            alert("Listing berhasil dibuat!");
            setActivePage("marketplace");
        });
    }

    function renderRiwayat(container) {
        container.innerHTML = `
            <div class="page-header"><h1 class="page-title">Riwayat Transaksi</h1></div>
            <div class="section-card">
                <table class="history-table"><thead><tr><th>Aset</th><th>Berat</th><th>Mitra</th><th>Total</th><th>Fee</th><th>Tanggal</th><th>Status</th></tr></thead>
                <tbody>${p2pTransactions.map(t => `<tr><td>${t.asset}</td><td>${t.gram}g</td><td>${t.counterparty}</td><td>${formatRupiah(t.totalPrice)}</td><td>${formatRupiah(t.fee)}</td><td>${t.date}</td><td>${t.status}</td></tr>`).join('')}</tbody></table>
            </div>
        `;
    }

    function setActivePage(pageId) {
        currentPage = pageId;
        document.querySelectorAll(".nav-item").forEach(item => {
            if(item.getAttribute("data-page") === pageId) item.classList.add("active");
            else item.classList.remove("active");
        });
        render();
    }

    function attachNavEvents() {
        document.querySelectorAll(".nav-item").forEach(nav => {
            nav.removeEventListener("click", nav._listener);
            nav.addEventListener("click", () => setActivePage(nav.getAttribute("data-page")));
            nav._listener = () => setActivePage(nav.getAttribute("data-page"));
        });
    }

    setActivePage("dashboard");
</script>
</body>
</html>
